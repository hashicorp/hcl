name: 'Setup Ragel'
description: 'Installs Ragel and outputs installed version'
outputs:
  version:
    description: "Ragel version"
    value: ${{ steps.ragel.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Install Ragel (Linux)
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: sudo apt install ragel

    - name: Install Ragel (macOS)
      shell: bash
      if: ${{ runner.os == 'macOS' }}
      run: brew install ragel

    - name: Install Ragel (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: winget install -e --id PolarGoose.Ragel

    - name: Ragel version
      id: ragel
      shell: ${{ case(runner.os == 'Windows', 'pwsh', 'bash') }}
      run: ragel --version >> "$GITHUB_OUTPUT"
